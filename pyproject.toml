[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency-mbs-tracker"
version = "0.1.0"
description = "Open-source tracker for monthly amortization (pool factor) history of agency MBS/CMO pools (Ginnie Mae, Freddie Mac)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Montenegro" }]
keywords = [
    "mbs",
    "cmo",
    "ginnie-mae",
    "freddie-mac",
    "pool-factor",
    "amortization",
    "fixed-income",
    "cusip",
    "isin",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
agency-mbs = "agency_mbs.cli:main"

[project.urls]
Homepage = "https://github.com/AMonten/agency-mbs-tracker"
Repository = "https://github.com/AMonten/agency-mbs-tracker"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_mbs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
